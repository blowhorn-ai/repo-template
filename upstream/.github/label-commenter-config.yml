# Label Commenter configuration for repository automation
# Automatically comments on issues and pull requests when specific labels are applied.

comment:
  footer: "\n\n---\n*Community Automation • [Contributing Guidelines](CONTRIBUTING.md)*"

labels:
  - name: "help wanted"
    labeled:
      issue:
        body: >
          👋 **Welcome contributors!** This issue is labeled `help wanted` and is open for contributions.


          Please review our [Contributing Guide](CONTRIBUTING.md) to get started. If you plan to work on this, comment below so we can coordinate and avoid duplicate effort!
        action: open

  - name: "good first issue"
    labeled:
      issue:
        body: >
          🌱 **New to this project?** This issue is designated as a `good first issue`—ideal for newcomers to our codebase.


          If you need guidance or have questions, feel free to ask directly in this thread or email support. We're excited to have you contribute!
        action: open

  - name: "status/in-progress"
    labeled:
      issue:
        body: >
          ⚙️ This issue has been marked `status/in-progress`. Please feel free to open a Draft Pull Request early so the team can provide feedback and review your progress.
        action: open

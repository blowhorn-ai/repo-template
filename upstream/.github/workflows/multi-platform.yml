name: Multi-platform Container Build (Optional)

on:
  workflow_dispatch:
    inputs:
      registry:
        description: "Target container registry (e.g. ghcr.io or docker.io)"
        required: true
        default: "ghcr.io"
        type: string
      image:
        description: "Container image name (e.g. ghcr.io/<ORGANIZATION>/<PROJECT_NAME>)"
        required: true
        default: "ghcr.io/<ORGANIZATION>/<PROJECT_NAME>"
        type: string
      tag:
        description: "Image tag to apply"
        required: true
        default: "latest"
        type: string
      platforms:
        description: "Comma-separated target architectures"
        required: true
        default: "linux/amd64,linux/arm64"
        type: string
      push:
        description: "Publish image to registry (set to true only when ready to push)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Multi-Architecture Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.image }}:${{ inputs.tag }}

name: CI

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Repository Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Template CI Guidance
        run: |
          echo "================================================================="
          echo "Repository Template: CI Baseline"
          echo "================================================================="
          echo "Configure this workflow for your repository's specific toolchain."
          echo "Primary branches supported: main, master."
          echo "See docs/workflow-policy.md for recommendations and matrix examples."
          echo "================================================================="

# Path-based pull request labeler configuration
# Automatically adds labels to pull requests based on modified file paths.

area/docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "**/*.md"]

area/ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**", "scripts/**", "Makefile", "*.config.js", "*.config.mjs"]

area/security:
  - changed-files:
      - any-glob-to-any-file: ["SECURITY.md", "**/*security*/**"]

component/ui:
  - changed-files:
      - any-glob-to-any-file: ["src/ui/**", "public/**", "frontend/**", "ui/**"]

component/cli:
  - changed-files:
      - any-glob-to-any-file: ["bin/**", "cmd/**", "src/cli/**", "cli/**"]

component/backend:
  - changed-files:
      - any-glob-to-any-file: ["src/backend/**", "server/**", "api/**", "backend/**"]

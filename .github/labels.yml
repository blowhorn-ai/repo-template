# Canonical labels to create in each repository generated from this template.
# Run scripts/sync-labels.sh after creating the repository.

# Kinds of issues / changes
- name: "kind/bug"
  color: "d73a4a"
  description: "Something is not working as expected"
- name: "kind/enhancement"
  color: "a2eeef"
  description: "Improve existing functionality or user experience"
- name: "kind/feature"
  color: "0e8a16"
  description: "New functionality or capability"
- name: "kind/chore"
  color: "ededed"
  description: "Maintenance, dependency updates, or housekeeping"
- name: "kind/documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "kind/refactor"
  color: "d4c5f9"
  description: "Code refactoring without behavioral changes"
- name: "kind/test"
  color: "bfdadc"
  description: "Adding or improving test suites"

# Functional areas
- name: "area/ci"
  color: "5319e7"
  description: "Build, test, continuous integration, or automation"
- name: "area/docs"
  color: "0075ca"
  description: "Documentation guides, READMEs, or references"
- name: "area/security"
  color: "ee0701"
  description: "Security fixes, vulnerability reports, or audits"
- name: "area/infra"
  color: "1d76db"
  description: "Infrastructure, deployment, or hosting"
- name: "area/build"
  color: "bfdadc"
  description: "Build system, compilation, and package configuration"

# Components
- name: "component/ui"
  color: "1d76db"
  description: "User interface, frontend, and presentation layers"
- name: "component/backend"
  color: "5319e7"
  description: "Backend services, APIs, and business logic"
- name: "component/cli"
  color: "0052cc"
  description: "Command-line tools and utilities"
- name: "component/api"
  color: "0e8a16"
  description: "Public and private API interfaces"

# Issue and PR status
- name: "status/accepted"
  color: "0e8a16"
  description: "Issue triaged and accepted for implementation"
- name: "status/in-progress"
  color: "fbca04"
  description: "Work is actively ongoing"
- name: "status/blocked"
  color: "e11d21"
  description: "Blocked on external dependency or design decision"
- name: "status/stale"
  color: "ededed"
  description: "No recent activity or contributor response"
- name: "status/duplicate"
  color: "cfd3d7"
  description: "Duplicate of another issue or pull request"
- name: "status/wontfix"
  color: "ffffff"
  description: "Will not be implemented or resolved"

# Community and onboarding
- name: "help wanted"
  color: "008672"
  description: "Extra attention is welcome from community contributors"
- name: "good first issue"
  color: "7057ff"
  description: "Well-scoped task suitable for new contributors"
- name: "first-timers-only"
  color: "fbca04"
  description: "Reserved specifically for first-time contributors"
